# The Xcode project, generated by XcodeGen (`xcodegen generate`); Crumb.xcodeproj is not
# committed. Targets: the app, its Share extension, unit tests and UI tests. Everything
# that isn't UI lives in the CrumbKit package beside it.
#
# Signing: set DEVELOPMENT_TEAM (and CRUMB_BUNDLE_ID for your own identifiers) in
# Config/Local.xcconfig, or pass them to xcodebuild. Simulator builds need neither.
name: Crumb

options:
  bundleIdPrefix: app.crumb
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Crumb.xcconfig
  Release: Config/Crumb.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  CrumbKit:
    path: CrumbKit

targets:
  Crumb:
    type: application
    platform: iOS
    sources:
      - path: Crumb
        excludes:
          - "**/*.md"
    dependencies:
      - package: CrumbKit
        product: CrumbKit
      - target: CrumbShare
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CRUMB_BUNDLE_ID)
        PRODUCT_NAME: Crumb
        INFOPLIST_FILE: Crumb/Info.plist
        CODE_SIGN_ENTITLEMENTS: Crumb/Crumb.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    info:
      path: Crumb/Info.plist
      properties:
        CFBundleDisplayName: Crumb
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CrumbAppGroup: group.$(CRUMB_BUNDLE_ID)
        LSApplicationCategoryType: public.app-category.food-and-drink
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - NunitoSans-Regular.ttf
          - NunitoSans-SemiBold.ttf
          - NunitoSans-Bold.ttf
          - NunitoSans-ExtraBold.ttf
          - DMSerifDisplay-Regular.ttf
          - Caveat-Bold.ttf
        # crumb:// links: crumb://recipes/12, crumb://cookbooks/3, crumb://add?text=…
        CFBundleURLTypes:
          - CFBundleURLName: $(CRUMB_BUNDLE_ID)
            CFBundleURLSchemes: [crumb]
        # A Crumb on the kitchen Wi-Fi may be plain HTTP (crumb-core's allowsCleartext)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Crumb connects to your recipe server when it's on this network.
        NSCameraUsageDescription: Take photos of a recipe card or cookbook page to save it to Crumb.
        NSLocationWhenInUseUsageDescription: >-
          With “Sunrise & sunset”, Crumb turns dark at sunset where you are. Your location stays on this iPhone.

  CrumbShare:
    type: app-extension
    platform: iOS
    sources:
      - path: CrumbShare
    dependencies:
      - package: CrumbKit
        product: CrumbKit
      - sdk: UniformTypeIdentifiers.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CRUMB_BUNDLE_ID).share
        PRODUCT_NAME: CrumbShare
        INFOPLIST_FILE: CrumbShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: CrumbShare/CrumbShare.entitlements
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: CrumbShare/Info.plist
      properties:
        CFBundleDisplayName: Crumb
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CrumbAppGroup: group.$(CRUMB_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # A page from Safari, text from Notes, or photos of a recipe card
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 6

  CrumbTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CrumbTests
    dependencies:
      - target: Crumb
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CRUMB_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

  CrumbUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CrumbUITests
    dependencies:
      - target: Crumb
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CRUMB_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Crumb

schemes:
  Crumb:
    build:
      targets:
        Crumb: all
        CrumbShare: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Crumb
      targets:
        - name: CrumbTests
          parallelizable: false
        - name: CrumbUITests
          parallelizable: false
    archive:
      config: Release
