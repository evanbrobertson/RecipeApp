[package]
name = "crumb-work"
version = "0.1.0"
edition = "2024"
description = "Headless Chromium and cooking-video tools (yt-dlp, whisper.cpp, ffmpeg), for the server and crumb-relay."
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
crumb-fetch = { path = "../crumb-fetch" }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["process", "time", "sync", "io-util", "net", "rt", "macros", "fs"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
tracing = "0.1"
url = "2"
