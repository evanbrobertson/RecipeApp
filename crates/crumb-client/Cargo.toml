[package]
name = "crumb-client"
version = "0.1.0"
edition = "2024"
description = "Typed HTTP client for the Crumb REST API (used by the desktop app)."
license = "MIT"
publish = false

[dependencies]
crumb-core = { path = "../crumb-core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "json", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
axum = "0.8"
crumb = { path = "../.." }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
