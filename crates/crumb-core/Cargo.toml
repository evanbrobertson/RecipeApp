[package]
name = "crumb-core"
version = "0.1.0"
edition = "2024"
description = "Crumb's pure logic: recipe shapes, validation, parsers and ranking."
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
percent-encoding = "2"
rand = "0.8"
sha2 = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
url = "2"
