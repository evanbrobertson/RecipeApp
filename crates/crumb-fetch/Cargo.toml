[package]
name = "crumb-fetch"
version = "0.1.0"
edition = "2024"
description = "Fetches a page the way a browser does (Firefox and Safari TLS/HTTP2 profiles), for the server and crumb-relay."
license = "MIT"
publish = false

[dependencies]
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["net", "time", "io-util", "rt"] }
tracing = "0.1"
url = "2"
wreq = { workspace = true }
wreq-util = { workspace = true }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "io-util", "net"] }
