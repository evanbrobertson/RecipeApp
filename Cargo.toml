[package]
name = "crumb"
version = "3.0.0"
edition = "2024"
description = "Crumb: a private recipe box. Paste a link, keep just the recipe."
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hmac = "0.12"
pdf-extract = "0.7"
percent-encoding = "2"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_urlencoded = "0.7"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "process", "time", "signal", "sync", "io-util"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "compression-br", "compression-gzip", "normalize-path", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
