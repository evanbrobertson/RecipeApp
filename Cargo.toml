[workspace]
members = ["crates/crumb-core", "crates/crumb-client", "crates/crumb-ffi", "crates/crumb-fetch", "crates/crumb-relay", "crates/crumb-work", "desktop/linux"]
resolver = "3"

[workspace.dependencies]
# Pre-release: pinned exactly. Browser TLS/HTTP2 fingerprints for recipe pages (crumb-fetch,
# shared by the server and crumb-relay)
wreq = { version = "=6.0.0-rc.31", features = ["gzip", "brotli", "deflate", "zstd", "cookies"] }
wreq-util = "=3.0.0-rc.14"

[package]
name = "crumb"
version = "3.0.0"
edition = "2024"
description = "Crumb: a private recipe box. Paste a link, keep just the recipe."
license = "MIT"
publish = false

[dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crumb-core = { path = "crates/crumb-core" }
crumb-fetch = { path = "crates/crumb-fetch" }
crumb-work = { path = "crates/crumb-work" }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hmac = "0.12"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
pdf-extract = "0.7"
percent-encoding = "2"
rand = "0.8"
regex = "1"
# ES256 for Sign in with Apple's client secret (already built for rustls)
ring = "0.17"
# socks: reaching relays through a SOCKS5 proxy, for Tailscale (SCRAPE_RELAY_PROXY)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "json", "socks"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.21"
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "ureq", "rustls", "tracing"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_urlencoded = "0.7"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "process", "time", "signal", "sync", "io-util"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "compression-br", "compression-gzip", "normalize-path", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
webp = { version = "0.3.1", default-features = false }
# The types of crumb-fetch's clients, for the image fetch (src/images.rs)
wreq = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"
# Paused time, for the hedging tests
tokio = { version = "1", features = ["test-util"] }
# Captures what would be sent to Sentry, for the telemetry tests
sentry = { version = "0.49", default-features = false, features = ["test"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# Resizing photos in an unoptimised build is several times slower; keep the image codecs
# fast in `cargo run` too (only these crates, so debug builds stay quick)
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.libwebp-sys]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
