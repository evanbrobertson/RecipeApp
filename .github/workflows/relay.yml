# crumb-relay (crates/crumb-relay): the small service that fetches pages for a Crumb server from
# another network. Its own release stream: push a tag `relay-vX.Y.Z` (the version in
# crates/crumb-relay/Cargo.toml) and this builds it for Linux on x86-64, 64-bit ARM (Raspberry
# Pi 3/4/5 on a 64-bit OS) and 32-bit ARMv7 (a Pi on the 32-bit OS), attaches the binaries to a
# GitHub Release and pushes a multi-arch image to GHCR. Run by hand (Actions -> Relay -> Run
# workflow), it only builds and keeps the binaries as a workflow artifact. See docs/RELAY.md.
#
# The build machine is Ubuntu 22.04 on purpose: a binary needs the glibc it was linked against,
# and 22.04's (2.35) is older than Raspberry Pi OS Bookworm's and Debian 12's (2.36).
# BoringSSL (under wreq) is built from source by CMake, so the cross builds use the distribution's
# GCC cross toolchains and clang for the bindings.
name: Relay

on:
  push:
    tags: ["relay-v*"]
  workflow_dispatch:

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/evanbrobertson/recipeapp-relay

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            docker_arch: amd64
            packages: ""
            gcc: gcc
            gxx: g++
            sysroot: ""
          - target: aarch64-unknown-linux-gnu
            docker_arch: arm64
            packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross
            gcc: aarch64-linux-gnu-gcc
            gxx: aarch64-linux-gnu-g++
            sysroot: /usr/aarch64-linux-gnu
          - target: armv7-unknown-linux-gnueabihf
            docker_arch: arm
            packages: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6-dev-armhf-cross
            gcc: arm-linux-gnueabihf-gcc
            gxx: arm-linux-gnueabihf-g++
            sysroot: /usr/arm-linux-gnueabihf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        id: version
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/crumb-relay/Cargo.toml | head -n1)
          if [[ $GITHUB_REF == refs/tags/relay-v* ]]; then
            tag=${GITHUB_REF#refs/tags/relay-v}
            if [[ $tag != "$crate" ]]; then
              echo "::error::Tag relay-v$tag doesn't match crates/crumb-relay/Cargo.toml ($crate)"
              exit 1
            fi
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"
      - name: Build tools
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends cmake g++ git libclang-dev make $PACKAGES
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: relay-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          GCC: ${{ matrix.gcc }}
          GXX: ${{ matrix.gxx }}
          SYSROOT: ${{ matrix.sysroot }}
        run: |
          # Cargo and the cc crate read these per target: TRIPLE_WITH_UNDERSCORES
          triple=${TARGET//-/_}
          upper=$(tr '[:lower:]' '[:upper:]' <<<"$triple")
          export "CC_$triple=$GCC" "CXX_$triple=$GXX"
          export "CARGO_TARGET_${upper}_LINKER=$GCC"
          if [[ -n $SYSROOT ]]; then
            # The bindings for BoringSSL are generated by clang, which needs the target's headers
            export "BINDGEN_EXTRA_CLANG_ARGS_$triple=--sysroot=$SYSROOT -I$SYSROOT/include"
          fi
          cargo build --release --locked -p crumb-relay --target "$TARGET"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          DOCKER_ARCH: ${{ matrix.docker_arch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          name=crumb-relay-$VERSION-$TARGET
          mkdir "$name"
          cp "target/$TARGET/release/crumb-relay" crates/crumb-relay/crumb-relay.service LICENSE "$name/"
          tar -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          # The image is assembled from the same binaries (crates/crumb-relay/Dockerfile)
          mkdir -p image
          cp "target/$TARGET/release/crumb-relay" "image/crumb-relay-linux-$DOCKER_ARCH"
      - uses: actions/upload-artifact@v4 # TODO pin to a commit SHA like the other workflows
        with:
          name: relay-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4 # TODO pin to a commit SHA like the other workflows
        with:
          name: relay-image-${{ matrix.docker_arch }}
          path: image/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/relay-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4 # TODO pin to a commit SHA like the other workflows
        with:
          pattern: relay-*-linux-gnu*
          path: dist
          merge-multiple: true
      - run: |
          ls -l dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; not replacing it"
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Crumb relay ${TAG#relay-v}" \
            --notes "The Crumb relay for Linux on x86-64, 64-bit ARM and 32-bit ARMv7. Setup: docs/RELAY.md. Verify a download with the .sha256 file next to it." \
            dist/*

  image:
    name: Image (GHCR)
    needs: build
    if: startsWith(github.ref, 'refs/tags/relay-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4 # TODO pin to a commit SHA like the other workflows
        with:
          pattern: relay-image-*
          path: dist
          merge-multiple: true
      - run: chmod +x dist/* && ls -l dist
      - id: version
        run: echo "version=${GITHUB_REF_NAME#relay-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # No RUN step in the image, so nothing is emulated: the binaries are only copied in
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: crates/crumb-relay/Dockerfile
          build-args: BINARY_SOURCE=prebuilt
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
