# Every push to master: run the checks, build the image once, push it to GHCR, record the
# release in Sentry and deploy it to the Railway dev environment. Promotion to beta or stable
# (promote.yml) retags this same image; nothing is rebuilt. See docs/RELEASING.md.
name: Main

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "site/**"
      - "LICENSE"
  workflow_dispatch:

# Queue master builds (never cancel one half-way through a deploy)
concurrency:
  group: main
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/evanbrobertson/recipeapp
  SENTRY_ORG: team-evan
  SENTRY_PROJECT: crumb-recipes
  RAILWAY_CLI: ghcr.io/railwayapp/cli:5.62.1@sha256:e02abb3fd3d568ba2f5b02de069aacd2160ba7d2d876b36e95f64e984fdacbe1

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      short: ${{ steps.version.outputs.short }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          next=$(scripts/release/version.sh next "$GITHUB_SHA")
          version="${next}-main.${RUN_NUMBER}"
          {
            echo "version=$version"
            echo "short=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"
          echo "Building **$version** (\`sha-${GITHUB_SHA::7}\`)" >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Build and push image
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Immutable tags only here; `main` moves after the checks pass (deploy-dev)
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # One plain manifest, so promote.yml can read the labels back with imagetools
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:sha-${{ needs.version.outputs.short }}
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=Crumb
            org.opencontainers.image.description=A private recipe box
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
          build-args: |
            CRUMB_VERSION=${{ needs.version.outputs.version }}
            SENTRY_RELEASE=${{ needs.version.outputs.version }}
            SENTRY_ORG=${{ env.SENTRY_ORG }}
            SENTRY_PROJECT=${{ env.SENTRY_PROJECT }}
          # Uploads the web source maps from inside the build; empty when the secret is unset
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

  deploy-dev:
    name: Deploy to dev
    needs: [checks, version, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: dev
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHORT: ${{ needs.version.outputs.short }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE || 'RecipeApp' }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move the main tag
        run: docker buildx imagetools create --tag "$IMAGE:main" "$IMAGE:sha-$SHORT"

      - name: Sentry release (commits + dev deploy)
        if: env.SENTRY_AUTH_TOKEN != ''
        # Error reporting must never block a deploy
        continue-on-error: true
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        with:
          release: ${{ env.VERSION }}
          environment: dev
          set_commits: auto
          ignore_missing: true
          finalize: false
          disable_telemetry: true

      - name: Deploy to Railway
        run: |
          if [[ -z $RAILWAY_TOKEN ]]; then
            echo "::warning::RAILWAY_TOKEN is not set for the dev environment; skipping the deploy"
            exit 0
          fi
          docker run --rm -e RAILWAY_TOKEN "$RAILWAY_CLI" railway redeploy --from-source \
            --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" --yes
          echo "Deployed **$VERSION** to Railway \`$RAILWAY_ENVIRONMENT\`" >> "$GITHUB_STEP_SUMMARY"

  # The Android APK rides the same version, like the desktop app: built here as a workflow
  # artifact, never blocking deploy-dev. Signed when the CRUMB_KEYSTORE_* secrets exist.
  android-build:
    name: Android release build
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-setup
      - id: apk
        env:
          KEYSTORE_BASE64: ${{ secrets.CRUMB_KEYSTORE_BASE64 }}
          CRUMB_KEYSTORE_PASSWORD: ${{ secrets.CRUMB_KEYSTORE_PASSWORD }}
          CRUMB_KEY_ALIAS: ${{ secrets.CRUMB_KEY_ALIAS }}
          CRUMB_KEY_PASSWORD: ${{ secrets.CRUMB_KEY_PASSWORD }}
        run: android/scripts/build-release-apk.sh "$VERSION" android-dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crumb-android-${{ needs.version.outputs.version }}
          path: android-dist/
          retention-days: 30
          if-no-files-found: error

  # The desktop executable rides the same version as the server but ships on its own: it is
  # only built here (nothing is attached to a release yet) and it must never block or change
  # deploy-dev, which does not depend on this job. See docs/RELEASING.md.
  desktop-build:
    name: Desktop release build
    needs: version
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 45
    steps:
      # cxx-qt needs Qt 6.5+; see the desktop job in checks.yml
      - run: pacman -Syu --noconfirm --needed base-devel qt6-base qt6-declarative qt6-wayland rust clang pkgconf git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: desktop-archlinux
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo build --release -p crumb-desktop-linux --locked
      - env:
          VERSION: ${{ needs.version.outputs.version }}
        run: desktop/linux/packaging/build-tarball.sh "$VERSION" desktop-dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crumb-desktop-linux-${{ needs.version.outputs.version }}
          path: |
            desktop-dist/*.tar.gz
            desktop-dist/*.tar.gz.sha256
          retention-days: 30
          if-no-files-found: error
