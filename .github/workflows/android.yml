# The native Android app in android/ and the crumb-core library it links (crates/crumb-ffi):
# the Rust core cross-compiled for every Android ABI, the generated Kotlin bindings, JVM unit
# tests against the real core, lint, and debug + release APKs. Release APKs are signed only
# when the CRUMB_KEYSTORE_* secrets exist (see android/README.md). Versioned release APKs
# are built by main.yml and attached to GitHub Releases by promote.yml.
name: Android

on:
  push:
    branches: [master]
    paths: &paths
      - "android/**"
      - "crates/crumb-core/**"
      - "crates/crumb-ffi/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
      - ".github/actions/android-setup/**"
  pull_request:
    branches: [master]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: android

jobs:
  build:
    name: Android (core, test, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-setup
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CRUMB_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "CRUMB_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No release keystore; the release APK is unsigned." >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: ./gradlew --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
        env:
          CRUMB_KEYSTORE_PASSWORD: ${{ secrets.CRUMB_KEYSTORE_PASSWORD }}
          CRUMB_KEY_ALIAS: ${{ secrets.CRUMB_KEY_ALIAS }}
          CRUMB_KEY_PASSWORD: ${{ secrets.CRUMB_KEY_PASSWORD }}
      - name: Check every ABI carries crumb-core
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$apk" | grep -q "lib/$abi/libcrumb_ffi.so" || { echo "::error::$abi is missing libcrumb_ffi.so"; exit 1; }
          done
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crumb-android-${{ github.run_number }}
          path: android/app/build/outputs/apk/
